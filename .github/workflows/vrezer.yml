name: Build & Deploy VREZER

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Site Assets
        run: |
          rm -rf _site
          mkdir -p _site
          cp backend/src/main/resources/templates/index.html _site/index.html
          cp backend/src/main/resources/static/script.js _site/script.js
          cp backend/src/main/resources/static/vrezer-stable.js _site/vrezer-stable.js
          cp backend/src/main/resources/static/style.css _site/style.css
          # Cache-bust frontend assets so GitHub Pages cannot serve a stale JS/CSS bundle.
          sed -i "s#script.js#script.js?v=${{ github.sha }}#g" _site/index.html
          sed -i "s#style.css#style.css?v=${{ github.sha }}#g" _site/index.html
          touch _site/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
