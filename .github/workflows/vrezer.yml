name: Build & Deploy VREZER 3.0

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Site Assets
        run: |
          rm -rf _site
          mkdir -p _site
          cp backend/src/main/resources/templates/index.html _site/index.html
          cp backend/src/main/resources/static/script.js _site/script.js
          cp backend/src/main/resources/static/style.css _site/style.css
          touch _site/.nojekyll

      - name: Validate configured secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo "Missing GEMINI_API_KEY" && exit 1)
          test -n "$GROQ_API_KEY" || (echo "Missing GROQ_API_KEY" && exit 1)
          test -n "$LLAMA_API_KEY" || (echo "Missing LLAMA_API_KEY" && exit 1)
          test -n "$JOOBLE_API_KEY" || (echo "Missing JOOBLE_API_KEY" && exit 1)
          test -n "$ADZUNA_APP_KEY" || (echo "Missing ADZUNA_APP_KEY" && exit 1)
          echo "Required API secrets are configured in GitHub."
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
