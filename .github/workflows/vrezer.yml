name: Build & Deploy VREZER 3.0

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "vrezer-production"
  cancel-in-progress: true

jobs:
  validate-and-publish:
    name: Validate Backend + Frontend and Publish Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate Spring Boot Backend
        working-directory: backend
        run: mvn -B clean package -DskipTests

      - name: Validate Frontend JavaScript
        run: node --check script.js

      - name: Prepare GitHub Pages Assets
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html script.js style.css _site/
          touch _site/.nojekyll

      - name: Publish GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
