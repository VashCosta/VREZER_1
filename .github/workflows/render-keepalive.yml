name: Keep VREZER Render Backend Warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm-render:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake production API
        shell: bash
        run: |
          set -e
          url="https://vrezer-backend.onrender.com/api/analyzer/version?keepalive=$(date +%s)"
          curl --fail --show-error --silent \
            --max-time 180 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "$url"
          echo
          echo "VREZER production backend responded successfully."
