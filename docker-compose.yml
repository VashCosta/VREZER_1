version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: careerforge-postgres
    environment:
      POSTGRES_DB: careerforgedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: careerforge-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    profiles:
      - qdrant
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerforge-backend
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      # PostgreSQL + pgvector
      - PGVECTOR_URL=jdbc:postgresql://postgres:5432/careerforgedb
      - PGVECTOR_USER=postgres
      - PGVECTOR_PASSWORD=password123
      # Spring Datasource (main JPA)
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/careerforgedb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password123
      # Qdrant
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=job_postings
      # AI Keys (pass from host environment)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # Job API Keys
      - ADZUNA_APP_ID=${ADZUNA_APP_ID:-}
      - ADZUNA_APP_KEY=${ADZUNA_APP_KEY:-}
      - JSEARCH_API_KEY=${JSEARCH_API_KEY:-}
      - JOOBLE_API_KEY=${JOOBLE_API_KEY:-}
      # Vector store type: pgvector or qdrant
      - VECTOR_STORE_TYPE=${VECTOR_STORE_TYPE:-pgvector}
      - JWT_SECRET=${JWT_SECRET:-change-me-locally}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerforge-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
