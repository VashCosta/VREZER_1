server.port=${PORT:9000}


# Multipart upload limits
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB

# Production-ready Database configuration (PostgreSQL if SPRING_DATASOURCE_URL/DATABASE_URL is set, otherwise H2)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:vrezer_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:}
spring.jpa.database-platform=${SPRING_JPA_DIALECT:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Health Check & Monitoring (Spring Boot Actuator)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://vashcosta.github.io,https://vrezer-3-0.vercel.app,http://localhost:5173,http://localhost:3000,http://localhost:7000,http://localhost:9000,http://127.0.0.1:*}

# Security & JWT Token Secrets
app.jwt.secret=${JWT_SECRET:vrezer_ai_super_secret_jwt_key_2026_production_secure_token_9876543210}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# AI Engine Models & Hybrid Model Routing (Gemini 3.5 & Meta LLaMA)
app.gemini.api-key=${GEMINI_API_KEY:${LLAMA_API_KEY:${GROQ_API_KEY:}}}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-pro}
app.gemini.fallback-models=gemini-3.5-flash,gemini-2.5-pro,gemini-2.5-flash,gemini-1.5-pro,gemini-1.5-flash

app.llama.api-key=${LLAMA_API_KEY:${GROQ_API_KEY:}}
app.llama.model=${LLAMA_MODEL:llama-3.3-70b-versatile}
app.llama.url=${LLAMA_URL:https://api.groq.com/openai/v1/chat/completions}

app.deepseek.api-key=${DEEPSEEK_API_KEY:}
app.deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}
app.deepseek.url=${DEEPSEEK_URL:https://api.deepseek.com/v1/chat/completions}
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=gpt-5.5
app.openai.url=https://api.openai.com/v1/chat/completions

# Job Market API Keys (Adzuna, Greenhouse, Lever, Remotive, Jooble, Google)
app.job-api.adzuna.app-id=${ADZUNA_APP_ID:}
app.job-api.adzuna.app-key=${ADZUNA_APP_KEY:}
app.job-api.google.api-key=${GOOGLE_API_KEY:}
app.job-api.google.cx=${GOOGLE_SEARCH_ENGINE_ID:}
app.job-api.jooble.api-key=${JOOBLE_API_KEY:}
app.job-api.jsearch.api-key=${JSEARCH_API_KEY:}

# External Skill Intelligence APIs
app.esco.api-url=https://ec.europa.eu/esco/api
app.esco.enabled=true
app.onet.api-url=https://services.onetcenter.org/ws
app.onet.enabled=true
app.languagetool.api-url=https://api.languagetool.org/v2/check
app.languagetool.enabled=true

# RAG Search, BGE Embeddings & Vector Store Config (Qdrant & pgvector)
app.rag.enabled=true
app.rag.max-retrieved-documents=25
app.rag.cache-ttl-minutes=10
app.rag.google-search-enabled=true
app.rag.ddg-search-enabled=true
app.embeddings.type=${EMBEDDINGS_TYPE:bge}
app.embeddings.model=${EMBEDDINGS_MODEL:BAAI/bge-small-en-v1.5}
app.vector-store.type=${VECTOR_STORE_TYPE:pgvector}
app.vector-store.qdrant.url=${QDRANT_URL:http://localhost:6333}
app.vector-store.qdrant.collection=${QDRANT_COLLECTION:job_postings}
app.vector-store.pgvector.url=${PGVECTOR_URL:jdbc:postgresql://localhost:5432/careerforgedb}
app.vector-store.pgvector.username=${PGVECTOR_USER:postgres}
app.vector-store.pgvector.password=${PGVECTOR_PASSWORD:password123}

# Job Aggregator & Similarity Ranking Config
app.job.similarity-threshold=35.0
app.job.cache.enabled=true

# Spring Cache (Caffeine) — Embedding vector cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=86400s

# PostgreSQL Production Profile (activated via env var SPRING_DATASOURCE_URL)
# When running via docker-compose, these override the H2 defaults:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/careerforgedb
#   SPRING_DATASOURCE_USERNAME=postgres
#   SPRING_DATASOURCE_PASSWORD=password123

